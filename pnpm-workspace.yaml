packages:
  - apps/*
  - packages/*

# Never block a scripted install waiting for a TTY confirmation.
confirmModulesPurge: false

# pnpm blocks dependency lifecycle scripts by default (supply-chain safety) and,
# unlike a local install, CI has no TTY to prompt for approval - it fails outright
# instead. esbuild's install script only fetches its own platform binary, so it's
# safe to allow explicitly rather than disabling the protection workspace-wide.
allowBuilds:
  esbuild: true

# Single source of truth for every third-party version in the monorepo.
# Workspace packages reference these with "catalog:" so two packages can never
# drift onto different React or MUI versions.
catalog:
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@mui/icons-material': ^9.4.0
  '@mui/material': ^9.4.0
  '@mui/x-charts': ^9.14.0
  '@tanstack/react-query': ^5.103.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  husky: ^9.1.7
  jsdom: ^30.1.0
  lint-staged: ^17.5.1
  oxlint: ^1.83.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router: ^8.4.0
  storybook: ^10.6.0
  '@storybook/addon-docs': ^10.6.0
  '@storybook/react-vite': ^10.6.0
  typescript: ~7.0.2
  vite: ^8.3.0
  vitest: ^5.0.1
  vitest-axe: ^0.1.0
  zod: ^4.4.3
  zustand: ^5.0.15

minimumReleaseAgeExclude:
  - '@mui/x-charts@9.14.0'
  - '@mui/x-internal-gestures@9.14.0'
  - '@mui/x-internals@9.14.0'
