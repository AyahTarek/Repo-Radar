packages:
  - apps/*
  - packages/*

# Never block a scripted install waiting for a TTY confirmation.
confirmModulesPurge: false

# Single source of truth for every third-party version in the monorepo.
# Workspace packages reference these with "catalog:" so two packages can never
# drift onto different React or MUI versions.
catalog:
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@mui/icons-material': ^9.4.0
  '@mui/material': ^9.4.0
  '@mui/x-charts': ^9.14.0
  '@tanstack/react-query': ^5.103.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  jsdom: ^30.1.0
  oxlint: ^1.83.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router: ^8.4.0
  typescript: ~7.0.2
  vite: ^8.3.0
  vitest: ^5.0.1
  zod: ^4.4.3
  zustand: ^5.0.15

minimumReleaseAgeExclude:
  - '@mui/x-charts@9.14.0'
  - '@mui/x-internal-gestures@9.14.0'
  - '@mui/x-internals@9.14.0'
