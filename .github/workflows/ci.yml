name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR/branch cancels the run already in progress for it,
# so pushing twice in a row doesn't burn double the minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's "packageManager" field,
      # so the CI pnpm version can never drift from what's committed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm --filter web test:e2e:install

      - run: pnpm --filter web test:e2e

      - if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
